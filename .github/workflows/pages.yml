# テストをして、通ったら dist/ を GitHub Pages に公開する
#
# - main に送ったとき(push)と、Actions の画面から main で手で動かしたとき: テストのあと公開する
# - プルリクエストと、main 以外のブランチで手で動かしたとき: テストだけ(公開しない)
# - 公開するのは main の先頭のコミットだけ。続けて送ってテストの終わる順が逆になっても、
#   古いコミットを後から公開しない(公開の直前に main の先頭か調べる。P27-01)
# 公開には、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある。
#
# npm test は、dist/ の HTML がソースから作り直したものと同じかも調べる(test/dist.test.js)。
# そのため、公開されるのは、テストの通ったソースと同じ中身の dist/ になる。

name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # README の「Node.js 18 以上」の下限と、新しい版
        node: [18, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false   # 依存するパッケージがないので、キャッシュは要らない
      - run: npm test

  deploy:
    name: Publish to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:          # 仕事ごとに書くと上の permissions は置き換わるので、contents: read も書く
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # このコミットが今も main の先頭か。先頭でなければ(後から新しいコミットが送られていれば)公開しない。
      # concurrency で公開は1つずつ動くので、ここで調べれば、新しいコミットの公開の後に古いものが上書きしない。
      # checkout の ref を main に変えるのはだめ(テストしたコミットと公開するコミットが違ってしまう)
      - name: Check whether this commit is still main HEAD
        id: current
        shell: bash
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          test -n "$latest"
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skip publishing $GITHUB_SHA: main is now $latest."
          fi
      - if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v6
      - if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v5
