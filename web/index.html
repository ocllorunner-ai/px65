<!doctype html>
<!-- PX-65 emulator v{{version}}. CC0 1.0 Universal (public domain dedication): https://creativecommons.org/publicdomain/zero/1.0/ -->
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2b45">
<title>PX-65</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #74808c;
  --desk-shade: #67727d;
  --body: #1f2b45;
  --body-edge: #141c30;
  --plate: #2b3a5e;
  --silk: #c5cfe2;
  --silk-dim: #8391ad;
  --lcd: #a7b893;
  --lcd-ink: #222b1e;
  --lcd-ghost: #9cad88;
  --key-alpha: #e8e3d7;
  --key-alpha-ink: #2c2822;
  --key-pad: #93a0b6;
  --key-pad-ink: #172036;
  --key-fn: #d8a52b;
  --key-fn-ink: #2a2008;
  --key-brk: #c23b2f;
  --key-brk-ink: #fff4ef;
  --panel: #eceef1;
  --panel-line: #c9ced6;
  --ink: #1b2130;
  --ink-soft: #566074;
  --accent: #2b3a5e;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, ui-monospace, monospace;
  --sans: "Saira Semi Condensed", "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--desk);
  background-image: radial-gradient(circle at 30% 20%, #7f8b97 0, var(--desk) 45%, var(--desk-shade) 100%);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  touch-action: manipulation; /* ダブルタップでの拡大を防ぐ */
  -webkit-tap-highlight-color: transparent;
}

button, input, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .check:has(input:focus-visible) {
  outline: 2px solid #ffd76a;
  outline-offset: 2px;
}

.desk {
  display: grid;
  grid-template-columns: minmax(0, 680px) 360px;
  gap: 28px;
  justify-content: center;
  align-items: start;
  padding: 40px 24px 48px;
}

/* ---------- 本体 ---------- */

.unit {
  background: var(--body);
  border-radius: 18px 18px 26px 26px;
  padding: 22px 22px 26px;
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.08),
    inset 0 -4px 0 var(--body-edge),
    0 18px 30px rgba(20, 28, 48, 0.45);
}

.plate {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 18px 22px;
  align-items: end;
  background: var(--plate);
  border-radius: 10px;
  padding: 16px 18px 18px;
}

.brand {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  gap: 14px;
  color: var(--silk);
}
.brand .model {
  font-size: 26px;
  font-weight: 700;
  font-style: italic;
  letter-spacing: 0.02em;
}
.brand .line {
  flex: 1;
  height: 3px;
  align-self: center;
  background: repeating-linear-gradient(90deg, var(--key-fn) 0 22px, transparent 22px 26px);
  opacity: 0.85;
}
.brand .sub { font-size: 13px; color: var(--silk-dim); }

.bezel {
  background: #10182b;
  border-radius: 8px;
  padding: 10px 14px 14px;
}
.ann {
  display: grid;
  grid-template-columns: repeat(8, auto);
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.ann span { color: #2a3349; transition: color 60ms; }
.ann span.on { color: var(--lcd); }
#lcd {
  display: block;
  width: 384px;
  max-width: 100%;
  height: auto;
  image-rendering: pixelated;
  border-radius: 3px;
}

.fkeys {
  display: grid;
  grid-template-columns: repeat(2, 54px);
  gap: 10px;
  align-self: stretch;
  align-content: end;
}
.fkeys .arrows {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.keys {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "alpha pad" "bottom pad";
  gap: 8px 18px;
  margin-top: 20px;
}
.alpha { grid-area: alpha; display: grid; gap: 8px; }
.alpha .row, .bottom { display: flex; gap: 6px; }
.alpha .row:nth-child(2) { padding-left: 16px; }
.alpha .row:nth-child(3) { padding-left: 32px; }
.bottom { grid-area: bottom; }
.pad {
  grid-area: pad;
  display: grid;
  grid-template-columns: repeat(4, 42px);
  gap: 8px 6px;
  align-content: start;
}
.mobile-only, .key.mobile-only { display: none; }

.key {
  --face: var(--key-alpha);
  --ink-k: var(--key-alpha-ink);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  height: 36px;
  flex: 1 1 0;
  padding: 0;
  border: 0;
  border-radius: 6px 6px 8px 8px;
  background: var(--face);
  color: var(--ink-k);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22), 0 2px 0 rgba(0, 0, 0, 0.35);
  transition: transform 40ms, box-shadow 40ms;
}
.key .sub {
  position: absolute;
  top: 2px;
  right: 5px;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  opacity: 0.7;
}
.key.down {
  transform: translateY(2px);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22), 0 0 0 rgba(0, 0, 0, 0.35);
}
.key.num { --face: var(--key-pad); --ink-k: var(--key-pad-ink); }
.key.op { --face: var(--key-pad); --ink-k: var(--key-pad-ink); font-size: 18px; }
.key.fn { --face: var(--key-fn); --ink-k: var(--key-fn-ink); font-size: 13px; }
.key.brk { --face: var(--key-brk); --ink-k: var(--key-brk-ink); font-size: 13px; }
.key.wide { flex-grow: 1.8; }
.key.space { flex-grow: 5; }
.key.mode { --face: #5d6b88; --ink-k: #f1f4fa; font-size: 13px; flex-grow: 1.2; }

/* ---------- 操作 ---------- */

.controls {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  align-items: center;
  color: #f2f4f7;
}
.controls .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controls .sep { width: 1px; height: 26px; background: rgba(255, 255, 255, 0.25); }

.btn {
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(20, 28, 48, 0.35);
  color: #f6f7f9;
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
}
.btn:hover { background: rgba(20, 28, 48, 0.55); }
.btn.power[aria-pressed="true"] { background: #2f6a3f; border-color: #6fbf85; }
.btn.power[aria-pressed="false"] { background: #5a2a26; border-color: #c4766e; }
select.btn { padding-right: 6px; }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:hover { background: rgba(20, 28, 48, 0.35); }
.tapeinfo { font-size: 14px; color: #e4e8ee; }
.check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--key-fn); }

.status {
  margin: 10px 0 0;
  min-height: 1.45em;
  color: #f2f4f7;
  font-size: 14px;
}
.status.error { color: #ffd2cc; }

.howto {
  margin: 14px 0 0;
  color: #e4e8ee;
  font-size: 14px;
  max-width: 60ch;
}
.howto .touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .howto .pc { display: none; }
  .howto .touch { display: inline; }
}
.version {
  margin: 10px 0 0;
  color: #8a93a0;
  font-size: 12px;
}
.howto kbd {
  font-family: var(--mono);
  font-size: 12px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(20, 28, 48, 0.4);
}

/* ---------- デバッガ ---------- */

.debug {
  background: var(--panel);
  border-radius: 10px;
  padding: 16px 18px 18px;
  box-shadow: 0 10px 24px rgba(20, 28, 48, 0.25);
}
.debug h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}
.debug h3 {
  margin: 16px 0 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-soft);
}
.debug .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.debug .state { font-size: 14px; color: var(--ink-soft); }
.debug .state b { color: var(--ink); font-weight: 600; }

.dbtn {
  border: 1px solid var(--panel-line);
  background: #fff;
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
.dbtn:hover { border-color: var(--accent); }
.dbtn:disabled { opacity: 0.45; cursor: default; }
.dbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.drow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }

.hexin {
  width: 7ch;
  font-family: var(--mono);
  font-size: 13px;
  padding: 3px 6px;
  border: 1px solid var(--panel-line);
  border-radius: 5px;
  background: #fff;
}

.regs {
  display: grid;
  grid-template-columns: repeat(6, auto);
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 13px;
}
.regs div { display: grid; }
.regs span { color: var(--ink-soft); font-family: var(--sans); font-size: 12px; }
.flags { margin-top: 8px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.3em; }
.flags .off { color: #b3b9c4; }
.cycles { margin-top: 4px; font-size: 13px; color: var(--ink-soft); }

.code, .mem {
  margin: 0;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.55;
  white-space: pre;
  overflow-x: auto;
  background: #fff;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 6px 8px;
}
.code .cur { background: #ffe8a3; display: inline-block; width: 100%; }
.code .bp { color: #b3261e; }
.bps { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }

@media (max-width: 1100px) {
  .desk { grid-template-columns: minmax(0, 680px); }
}
/* ---------- スマートフォン(縦持ちと横持ちで共通) ---------- */
@media (max-width: 640px), (orientation: landscape) and (max-height: 500px) {
  .desk { display: block; padding: 0 0 32px; }
  .unit {
    height: 100vh;
    height: 100svh;               /* ブラウザのバーを除いた高さに収める */
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-radius: 0;
    padding: max(10px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  .plate { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
  .brand { gap: 10px; }
  .brand .model { font-size: 20px; }
  .brand .sub { font-size: 12px; }
  .bezel { padding: 8px 10px 10px; }
  .ann { font-size: 10px; gap: 2px; margin-bottom: 4px; }
  #lcd { width: 100%; }
  .fkeys { grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .fkeys .arrows { grid-column: 3 / -1; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .fkeys .key { height: 40px; }

  /* キーボードは残りの高さいっぱいに広げ、文字キーと数字キーをタブで切り替える */
  .keys {
    flex: 1 1 auto;
    min-height: 0;
    max-height: 420px;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .alpha, .pad { flex: 1 1 0; min-height: 0; gap: 6px; }
  .alpha { grid-template-rows: repeat(3, 1fr); }
  .pad { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
  .bottom { flex: 0 0 auto; height: clamp(44px, 9svh, 56px); order: 2; }
  .alpha, .pad { order: 1; }
  .keys[data-tab="alpha"] .pad, .keys[data-tab="num"] .alpha { display: none; }
  .alpha .row, .bottom { gap: 4px; }
  .alpha .row:nth-child(2) { padding-left: 4.5%; }
  .alpha .row:nth-child(3) { padding-left: 9%; }
  .key { height: auto; min-height: 40px; font-size: 18px; }
  .key.fn, .key.brk, .key.mode { font-size: 14px; }
  /* SHIFT で出る文字: 指で押すキーは大きいので、文字も大きく濃くする */
  .key .sub { top: 5px; right: 7px; font-size: 15px; font-weight: 700; opacity: 0.85; }
  /* 文字キーと数字キーの文字(SHIFT なし)も大きくする */
  .alpha .key, .pad .key { font-size: 20px; }
  .pad .key.op { font-size: 22px; }   /* ÷ × − + = は細く見えるので少し大きく */
  .mobile-only, .key.mobile-only { display: flex; }

  .controls, .status, .howto, .version { padding: 0 14px; }
  .controls .sep { display: none; }
  .btn { padding: 8px 14px; }
  .debug { display: none; margin: 18px 10px 0; }
  body.show-debug .debug { display: block; }
}

/* 縦持ち: 液晶を少し大きく見せるため、ブランドの「Pocket Computer」を省く */
@media (max-width: 640px) {
  .brand .sub { display: none; }
}

/* 横持ち: 左に液晶、右にキーボード */
@media (orientation: landscape) and (max-height: 500px) {
  .unit {
    display: grid;
    grid-template-columns: minmax(0, 44%) 1fr;
    gap: 12px;
  }
  .plate { display: flex; flex-direction: column; align-items: stretch; overflow: hidden; }
  .fkeys { margin-top: auto; }
  .bezel { padding: 6px 8px 8px; }
  #lcd { width: auto; max-width: 100%; max-height: calc(100svh - 150px); margin: 0 auto; }
  .fkeys .key { height: 36px; min-height: 36px; }
  .keys { max-height: none; height: 100%; margin-top: 0; }
  .key { min-height: 32px; font-size: 16px; }
  .key .sub { top: 4px; right: 6px; font-size: 14px; }
  .alpha .key, .pad .key { font-size: 18px; }
  .pad .key.op { font-size: 20px; }
  .bottom { height: clamp(36px, 14svh, 48px); }
}

@media (prefers-reduced-motion: reduce) {
  .key, .ann span { transition: none; }
}
</style>
</head>
<body>
<main class="desk">
  <div>
    <section class="unit" aria-label="{{unitLabel}}">
      <div class="plate">
        <div class="brand">
          <span class="model">PX-65</span>
          <span class="line" aria-hidden="true"></span>
          <span class="sub">Pocket Computer</span>
        </div>
        <div class="bezel">
          <div class="ann" id="ann" aria-hidden="true">
            <span>BUSY</span><span>SHIFT</span><span>CAPS</span><span>DEG</span>
            <span>RAD</span><span>RUN</span><span>PRO</span><span>LOW</span>
          </div>
          <canvas id="lcd" width="480" height="160" role="img" aria-label="{{lcdLabel}}"></canvas>
        </div>
        <div class="fkeys" id="fkeys"></div>
      </div>
      <div class="keys" id="keys" data-tab="alpha">
        <div class="alpha" id="alpha"></div>
        <div class="bottom" id="bottom"></div>
        <div class="pad" id="pad"></div>
      </div>
    </section>

    <div class="controls">
      <div class="group">
        <button class="btn power" id="power" aria-pressed="true">{{powerOn}}</button>
        <button class="btn" id="reset">{{reset}}</button>
        <button class="btn" id="clearRam">{{clearRam}}</button>
        <button class="btn mobile-only" id="dbgToggle" aria-expanded="false" aria-controls="debug">{{showDebugger}}</button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group">
        <button class="btn" id="romLoad">{{loadRom}}</button>
        <button class="btn" id="romBuiltin">{{useBuiltinRom}}</button>
        <input type="file" id="romFile" accept=".bin,.rom,application/octet-stream" hidden>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group">
        <button class="btn" id="tapeInsert">{{insertTape}}</button>
        <button class="btn" id="tapeSave">{{saveTape}}</button>
        <button class="btn" id="tapeEject">{{ejectTape}}</button>
        <span class="tapeinfo" id="tapeInfo"></span>
        <input type="file" id="tapeFile" accept=".tap,.bin,application/octet-stream" hidden>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group">
        <label class="check">{{speed}}
          <select class="btn" id="speed">
            <option value="1">×1</option>
            <option value="2">×2</option>
            <option value="4">×4</option>
            <option value="10">×10</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="sound" checked>{{sound}}</label>
        <label class="check" id="vibrateOption" hidden><input type="checkbox" id="vibrate" checked>{{vibration}}</label>
        <label class="check"><input type="checkbox" id="oneShotShift" checked>{{oneShotShift}}</label>
        <label class="check"><input type="checkbox" id="keepRam">{{keepRam}}</label>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group">
        <button class="btn" id="stateSave">{{saveState}}</button>
        <button class="btn" id="stateLoad">{{loadState}}</button>
      </div>
    </div>
    <p class="status" id="status" role="status"></p>
    <p class="howto">
      <span class="pc">{{howtoPc}}</span>
      <span class="touch">{{howtoTouch}}</span>
    </p>
    <p class="version">PX-65 emulator v{{version}}</p>
  </div>

  <aside class="debug" id="debug" aria-label="{{debugger}}">
    <div class="head">
      <h2>{{debugger}}</h2>
      <div class="state" id="dbgState"></div>
    </div>
    <div class="drow">
      <button class="dbtn primary" id="dbgRun">{{pause}}</button>
      <button class="dbtn" id="dbgStep">{{step}}</button>
      <button class="dbtn" id="dbgFrame">{{stepFrame}}</button>
    </div>

    <h3>{{registers}}</h3>
    <div class="regs" id="regs"></div>
    <div class="flags" id="flags"></div>
    <div class="cycles" id="cycles"></div>

    <h3>{{disassembly}}</h3>
    <pre class="code" id="code"></pre>
    <div class="drow">
      <label class="check">{{breakpoint}} <input class="hexin" id="bpAddr" placeholder="C079" spellcheck="false"></label>
      <button class="dbtn" id="bpAdd">{{add}}</button>
      <button class="dbtn" id="bpClear">{{clearAll}}</button>
    </div>
    <div class="bps" id="bps"></div>

    <h3>{{memory}}</h3>
    <div class="drow" style="margin-top:0;margin-bottom:6px">
      <label class="check">{{startAddress}} <input class="hexin" id="memAddr" value="0400" spellcheck="false"></label>
    </div>
    <pre class="mem" id="mem"></pre>
  </aside>
</main>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
